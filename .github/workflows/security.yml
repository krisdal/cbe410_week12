name: Security CI
on:
  push:
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: SAST
        run: bandit -r app.py -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Compile check
        run: python -m compileall -q app.py
  build:
    if: github.event_name == 'push'
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create checksum manifest
        run: |
          sha256sum app.py requirements.txt README.md > checksum-manifest.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign checksum manifest with Sigstore
        run: |
          cosign sign-blob --yes \
            --bundle checksum-manifest.txt.cosign.bundle \
            checksum-manifest.txt
      - name: Verify checksum signature
        run: |
          cosign verify-blob \
            --bundle checksum-manifest.txt.cosign.bundle \
            --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/security.yml@" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            checksum-manifest.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-build-checksums
          path: |
            app.py
            requirements.txt
            README.md
            checksum-manifest.txt
            checksum-manifest.txt.cosign.bundle
