name: Security CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: SAST
        run: bandit -r app.py -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Compile check
        run: python -m compileall -q app.py
  build:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create checksum manifest
        run: |
          sha256sum app.py requirements.txt README.md > checksum-manifest.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-checksums
          path: |
            app.py
            requirements.txt
            README.md
            checksum-manifest.txt
